        Whore by\_mgk\",\"title\":\"Hollywood Whore\",\"type\":\"Song\",\"url\":\"https://genius.com/Mgk-hollywood-whore-lyrics\"},\"annotations\":[{\"api_path\":\"/annotations/17192540\",\"body\":{\"plain\":\"On
        \u201CHollywood Whore\u201D, Machine Gun Kelly addresses a former business
        partner who betrayed him. It\u2019s also a general commentary on his experience
        in the music industry and how record companies manipulate artists, much like
        a prostitute on Hollywood Boulevard. It was the first song he wrote for Hotel
        Diablo.\\n\\nThe song interpolates Linkin Park\u2019s \u201CCrawling\u201D
        as a tribute to lead singer Chester Bennington, who died by suicide in July
        2017. MGK is an avid Linkin Park fan, and he was even set to join the band
        on their 2017 tour, although it was cancelled after Bennington\u2019s death.
        The song\u2019s music video includes a frame that reads \u201CR.I.P. Chester
        Bennington\u201D at 2:50, and MGK also mentions Bennington on \u201CGlass
        House.\u201D\\n\\nThe artwork for the single depicts a devilish Baphomet puppeteer,
        implying that artists are controlled by malevolent forces. This imagery coincides
        with the overall theme of Hotel Diablo.\"},\"comment_count\":0,\"community\":true,\"custom_preview\":null,\"has_voters\":true,\"id\":17192540,\"pinned\":false,\"share_url\":\"https://genius.com/17192540\",\"source\":null,\"state\":\"accepted\",\"url\":\"https://genius.com/17192540/Mgk-hollywood-whore/Hollywood-whore\",\"verified\":false,\"votes_total\":117,\"current_user_metadata\":{\"permissions\":[\"vote\",\"propose_edit_to\",\"report_as_abusive\",\"create_comment\"],\"excluded_permissions\":[\"edit\",\"cosign\",\"uncosign\",\"destroy\",\"accept\",\"reject\",\"see_unreviewed\",\"clear_votes\",\"pin_to_profile\",\"unpin_from_profile\",\"update_source\",\"edit_custom_preview\"],\"interactions\":{\"cosign\":false,\"pyong\":false,\"vote\":null},\"iq_by_action\":{\"accept\":{\"primary\":{\"multiplier\":1,\"base\":10.0,\"applicable\":true}},\"reject\":{\"primary\":{\"multiplier\":1,\"base\":2.0,\"applicable\":true}},\"delete\":{\"primary\":{\"multiplier\":1,\"base\":5.0,\"applicable\":true}}}},\"authors\":[{\"attribution\":0.37333333333333335,\"pinned_role\":null,\"user\":{\"api_path\":\"/users/1873201\",\"avatar\":{\"tiny\":{\"url\":\"https://images.genius.com/avatars/tiny/f87cf09959b1401ea9890cc6f5291188\",\"bounding_box\":{\"width\":16,\"height\":16}},\"thumb\":{\"url\":\"https://images.genius.com/avatars/thumb/f87cf09959b1401ea9890cc6f5291188\",\"bounding_box\":{\"width\":32,\"height\":32}},\"small\":{\"url\":\"https://images.genius.com/avatars/small/f87cf09959b1401ea9890cc6f5291188\",\"bounding_box\":{\"width\":100,\"height\":100}},\"medium\":{\"url\":\"https://images.genius.com/avatars/medium/f87cf09959b1401ea9890cc6f5291188\",\"bounding_box\":{\"width\":300,\"height\":400}}},\"header_image_url\":\"https://images.genius.com/dcac0ceaa601aa65e65c79c4fc17af29.640x213x1.jpg\",\"human_readable_role_for_display\":\"Editor\",\"id\":1873201,\"login\":\"VinylZombie_MCR\",\"name\":\"thebreakup\",\"role_for_display\":\"editor\",\"url\":\"https://genius.com/VinylZombi