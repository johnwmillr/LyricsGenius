      string: "{\"meta\":{\"status\":200},\"response\":{\"artist\":{\"_type\":\"artist\",\"alternate_names\":[\"Machine
        Gun Kelly\",\"Richard Colson Baker\",\"Colson Baker\"],\"api_path\":\"/artists/1665\",\"description\":{\"plain\":\"Initially
        emerging as a lyrical rapper before diversifying his catalog to include pop
        realms and adding pop punk to his repertoire, a transition that led to Billboard
        dubbing him the \u201CCrown Prince of Pop Punk\u201D, Machine Gun Kelly (born
        Colson Baker on April 22, 1990) is an American rapper, singer, songwriter,
        and actor from Cleveland, Ohio.\\n\\nTraveling the world because of his parents'
        jobs before settling down in Cleveland, Machine Gun Kelly, commonly referred
        to as MGK, earned his stage name for his lightning-fast delivery while still
        in high school. His breakthrough came at the start of the 2010s with his party-rap
        hit \u201CWild Boy\u201D, mixing his lightning-fast flow with hedonistic,
        party-ready lyrics over a bass-heavy beat. He would go on to release two more
        rap albums before making his crossover into pop.\\n\\nHis third album, bloom,
        marked a stylistic and commercial turning point for the Ohio rapper. Led by
        his smash hit single \u201CBad Things\u201D, a pop-rap duet with, at-the-time,
        rising songstress Camila Cabello, the album saw his style pivot to pop and
        his sales increase accordingly. With \u201CBad Things\u201D becoming a top
        five hit on the Hot 100 and reaching the top spot of the pop charts, as well
        as the album\u2019s other hit, \u201CAt My Best\u201D, nearly cracking the
        top 20 of the pop charts, the album became the most successful of Machine
        Gun Kelly\u2019s career.\\n\\nAfter a highly-publicized feud with Eminem and
        a critically-acclaimed rap-rock album in 2018 and 2019, respectively, Machine
        Gun Kelly started to become a household name in 2020 with the release of Tickets
        To My Downfall, reviving pop punk with a uniquely hip-hop-inspired spin. The
        approach proved successful, with the album\u2019s single my ex\u2019s best
        friend\u201D staying on the Hot 100 chart for a full year. At the front of
        a revival of pop-punk and rock music in the mainstream, he followed up with
        2022\u2019s mainstream sellout, for which he earned a Grammy nomination, a
        first in his career.\\n\\nTo date, Machine Gun Kelly has certified sales of
        25 million singles and 2.5 million albums.\"},\"description_preview\":\"Initially
