        Quotes:\\n\\nBeing right is a distant second to the joy of compassion\\n\\nThis
        really resonates with me since I\u2019m someone who loves debating and critical
        thinking, and yet I have to remind myself that loving others, and the joy
        that comes with it, is far more important than proving I\u2019m right in a
        debate.\\n\\nGod Is Most Glorified in Us When We Are Most Satisfied in Him\\n\\nFor
        me it is ultimately all about God. I may frequently mess up in living it out,
        but it remains my goal to glorify God in everything I do and derive my happiness
        (true satisfaction) from Him.\\n\\nBlood of a slave, heart of a king\\n\\nMy
        ancestors in Germany were serfs\u2013slaves to the local landowner. Hence,
        I have the blood of a slave and, I would like to imagine at least, the heart
        of a king.\\n\\n\\n\\n\\n\\n\\n\\nPersonal Milestones:\\n08/22/13 \u2013 Editor\u2019d
        by Shawn\\n11/01/13 \u2013 250 Annotations\\n11/12/13 \u2013 One of My Annotations
        is Annotated, the First Annotation to be Annotated Ever (the Very First of
