        Ra\xEBl by\_Freeze\_Corleone\",\"title\":\"Freeze Ra\xEBl\",\"type\":\"Song\",\"url\":\"https://genius.com/Freeze-corleone-freeze-rael-lyrics\"},\"annotations\":[{\"_type\":\"annotation\",\"api_path\":\"/annotations/20641014\",\"being_created\":false,\"body\":{\"plain\":\"\u201CFreeze
        Ra\xEBl\u201D est le premier titre du premier album de Freeze Corleone, LMF.
        Le nom de cette introduction fait r\xE9f\xE9rence \xE0 Ra\xEBl, le gourou
        du mouvement ra\xEBlien, auquel le rappeur s'identifie.\\n\\nDe mani\xE8re
        provocante, Freeze joue aussi sur la proximit\xE9 de ce titre avec \u201CIsra\xEBl\u201D.
        L'artiste s\xE9n\xE9galais est en effet coutumier des phases antisionistes
        et des critiques ou insultes envers l'\xC9tat d'Isra\xEBl, comme par exemple
        dans le titre \u201C3 Plan\xE8tes\u201D sur Projet Blue Beam :\\n\\nChaque
        jour fuck Isra\xEBl comme si j'habite \xE0 Gaza\\n\\nLe choix de ce titre
        est donc une preuve sarcastique du cynisme du rappeur, reconnu comme personnage
        controvers\xE9 depuis ses d\xE9boires avec certains m\xE9dias, qui soulignaient
        ses textes plus que borderline.\\n\\nLe titre a par la suite \xE9t\xE9 supprim\xE9
        par YouTube, une semaine apr\xE8s sa sortie pour \u201Ccontenus incitant \xE0
        la haine\u201D. Cependant, il refait son apparition sur la plateforme le 23
        septembre 2020.\\n\\nAvec le succ\xE8s de LMF, certifi\xE9 disque d'or en
        trois semaines d'exploitation, \u201CFreeze Ra\xEBl\u201D est \xE0 son tour
        par la suite certifi\xE9 single d'or le 13 novembre 2020. Il s'agit du premier
        single d'or de Freeze Corleone. Le 12 septembre 2022, le titre per\xE7oit
        la certification de single de diamant en France par le SNEP, en cumulant plus
        de 50 000 000 de streams.\\n\\nPr\xE8s de 10 mois apr\xE8s la sortie du morceau,
        un visuel de celui-ci appara\xEEt par surprise sur la cha\xEEne YouTube du
        Mangemort Squad. R\xE9alis\xE9 par Nada Frikha, il met en sc\xE8ne Freeze
        Corleone dans diff\xE9rentes sc\xE8nes d'animation. Au-del\xE0 des images,
        c'est le texte qui interpelle les fans puisqu'un passage a \xE9t\xE9 modifi\xE9,
        de sorte que \u201Cj'suis partout comme Arouf\u201D devienne \u201Ctous les
        jours, fuck Arouf\u201D. Cela donne lieu \xE0 une version alternative en streaming.\\nhttps://twitter.com/freezecorleone/status/1411124091793387526\"},\"comment_count\":1,\"community\":true,\"created_at\":1599830817,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
