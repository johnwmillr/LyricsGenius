        ses morceaux et souvent repris par sa communaut\xE9.\\n\\nIl donne ensuite
        les diminutifs de plusieurs noms du crew qu'il a cr\xE9\xE9 : 667, Mangemort
        Squad, Ligue Des Ombres.\\n\\nL'acronyme NRM fait r\xE9f\xE9rence au \u201CNouveau
        Rap Mondial\u201D, un mouvement que Freeze mentionne \xE0 de tr\xE8s nombreuses
        reprises dans ses sons. C'est aussi un hommage au Roi Heenok, qui a invent\xE9
        ce concept pour pr\xE9tendre \xE0 une domination sur le rap du monde entier.
