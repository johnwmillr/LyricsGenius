        by\_Sia\",\"title\":\"Chandelier\",\"type\":\"Song\",\"url\":\"https://genius.com/Sia-chandelier-lyrics\"},\"annotations\":[{\"_type\":\"annotation\",\"api_path\":\"/annotations/3721376\",\"being_created\":false,\"body\":{\"plain\":\"\u201CChandelier\u201D
        was released as the lead single from Sia\u2019s sixth studio album, 1000 Forms
        Of Fear. Despite its soaring melody, the song has a sad theme describing the
        life of a \u201Cparty girl\u201D. On the track, Sia talks about her alcohol
        and drug addiction.\\n\\nSia has written songs for pop stars like Rihanna,
        Katy Perry, and Britney Spears, but this time she saves the \u201Cswing from
        the chandelier\u201D moment for her own angelic voice.\\n\\nThe song has been
        described by many as Sia\u2019s breakthrough performance due to its huge commercial
        success and critical acclaim. Billboard named the track one of the most memorable
        choruses of all time.\\n\\nMaddie Ziegler revealed in a YouTube video that
        the people on set said that the set was haunted, due to the building being
        very old. Being an eleven-year-old, she was scared to dance there on her own.
        Maddie also said that when Sia reached out to her, asking her to be in the
        music video, she thought she would be a backup dancer:\\n\\nBut when I got
        on set, it was just me in rehearsal.\"},\"comment_count\":0,\"community\":true,\"created_at\":1395069378,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
