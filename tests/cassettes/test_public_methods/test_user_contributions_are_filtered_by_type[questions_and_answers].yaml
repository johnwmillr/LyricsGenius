        Z created \u201CShe Drives Me Crazy\u201D\u2019s iconic snare:\\n\\n\\nI took
        the head off a snare drum and started whacking it with a wooden ruler, recording
        it through a Shure 57 microphone.\\n\\nAs I did that, I started twisting the
        hell out of the [API 550] EQ around 1 kHz on it, to the point where it was
        starting to sound more like a crash. I blended that with a snare I found in
        the Linn itself, which was a 12-bit machine, so it sounded pretty edgy to
        start with\\n\\n\\nThis interview is from Mixonline, which continues:\\n\\nBut
        the coup de grace for the sound was when Z pumped the processed and blended
        sample through an Auratone speaker set upside down atop another snare drum,
        which rattled the metal snares and gave the result some ambience and even
        more high end.\"},\"body_for_edit\":\"David Z created \\\"She Drives Me Crazy\\\"'s
