reated\":false,\"body\":{\"plain\":\"\u201CA
        Milli\u201D was released as the second single from Lil Wayne\u2019s album
        Tha Carter III. A version of \u201CA Milli\u201D featuring Cory Gunz was leaked
        prior to the album\u2019s release. The single was certified 6x platinum after
        it peaked at #6 on the Billboard Hot 100 chart and topped both the Hot Rap
        Tracks and Hot R&B/Hip-Hop Songs charts. Lil Wayne won a Grammy Award for
        \u201CA Milli\u201D in the Best Rap Solo Performance category in 2009.\\n\\nThis
        Bangladesh bass boosted beat sampled \u201Ca milli\u201D from Phife Dawg\u2019s
        intro on A Tribe Called Quest\u2019s \u201CI Left My Wallet in El Segundo
        (Vampire Mix)\u201D:\\n\\nhttps://www.youtube.com/watch?v=S-Pweik2Vao\\n\\nIn
        2010, Bangladesh talked about not receiving royalties from Cash Money to the
        tune of $500,000 for \u201CA Milli\u201D and he was prepared to go to court
        over the issue but the parties agreed on a settlement out of court later that
        year.\"},\"comment_count\":0,\"community\":true,\"created_at\":1253918569,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
