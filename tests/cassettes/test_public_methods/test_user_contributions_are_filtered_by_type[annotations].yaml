        ra\xE7a de ef\xEAmeros, filhos do acaso e da pena, por que me obrigar a dizer
        o que n\xE3o t\xEAm o menor interesse em escutar? O bem supremo te \xE9 absolutamente
        inacess\xEDvel: \xE9 n\xE3o ter nascido, \xE9 n\xE3o ser, nada ser. Em compensa\xE7\xE3o,
        o segundo dos bens tu podes ter: \xE9 logo morrer\u201D. \u2013 Sileno\\n\\n\\n\\n\u201C\xC9
        tolo, portanto, quem diz ter medo da morte, n\xE3o porque a chegada desta
        lhe trar\xE1 sofrimento,\\nmas porque o aflige a pr\xF3pria espera: aquilo
        que n\xE3o nos perturba quando presente n\xE3o deveria afligir-nos enquanto
        est\xE1 sendo esperado. Ent\xE3o, o mais terr\xEDvel de todos os males, a
        morte, n\xE3o significa nada pra n\xF3s, justamente porque, quando estamos
        vivos, \xE9 a morte que n\xE3o est\xE1 presente; ao contr\xE1rio, quando a
        morte est\xE1 presente, n\xF3s \xE9 que n\xE3o estamos. A morte, portanto,
        n\xE3o \xE9 nada, nem para os vivos, nem para os mortos, j\xE1 que para aqueles
        ela n\xE3o existe, ao passo que estes n\xE3o est\xE3o mais aqui. E, no entanto,
        a maioria das pessoas ora foge da morte como se fosse o maior dos males, ora
        a deseja como descanso dos males da vida.\u201D Epicuro, em \u201CCarta sobre
        a felicidade\u201D.\\n\\n\\n\\n\u201CTHIS is nature\u2019s nest of boxes:
        the heavens contain the earth; the earth, cities; cities, men. And all these
        are concentric; the common centre to them all is decay, ruin.\u201C \u2013
