        Ramona Lavigne</strong> is a French-Canadian singer-songwriter, fashion designer
        and actress. She was born in Belleville, Ontario, but spent most of her youth
        in Greater Napanee, Ontario. By the age of 15, she had appeared on stage with
        Shania Twain; by 16, she had signed a two-album recording contract with Arista
        Records worth more than $2 million.</p>\\n\\n<p>In 2002, when she was 17 years
        old, Lavigne broke onto the music scene with her debut album <a href=\\\"https://genius.com/albums/Avril-lavigne/Let-go\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/20745\\\"><em>Let Go</em></a>
        It featured top 10 hits<a href=\\\"https://genius.com/Avril-lavigne-complicated-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/86251\\\">\u201CComplicated,\u201D</a>
        <a href=\\\"https://genius.com/Avril-lavigne-sk8er-boi-lyrics\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/songs/163793\\\">\u201CSk8er Boi,\u201D</a> and <a href=\\\"https://genius.com/Avril-lavigne-im-with-you-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/198967\\\">\u201CI\u2019m With
        You.\u201D</a></p>\\n\\n<p>2004 saw the release of her sophomore effort, the
        darker, grungier <em><a href=\\\"https://genius.com/albums/Avril-lavigne/Under-my-skin\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/41194\\\">Under My Skin</a></em>
        which was her first #1 in the states and featured top 10 hit <a href=\\\"https://genius.com/Avril-lavigne-my-happy-ending-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/198942\\\">\u201CMy Happy Ending,\u201D</a>
        and top 40 lead single <a href=\\\"https://genius.com/Avril-lavigne-dont-tell-me-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/198935\\\">\u201CDon\u2019t
        Tell Me.\u201D</a></p>\\n\\n<p>Three years later she returned with her second
        number 1 <em><a href=\\\"https://genius.com/albums/Avril-lavigne/The-best-damn-thing\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/23540\\\">The Best Damn Thing</a></em>,
        a bright, pop-punk album which strayed away from her previous efforts switching
        meaningful and personal lyricism music she more bratty, fun music she could
        enjoy performing live. It spawned Avril\u2019s first and only #1 hit on the
        Billboard Hot 100 chart: <a href=\\\"https://genius.com/Avril-lavigne-girlfriend-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/96005\\\">\u201CGirlfriend.\u201D</a>
        The song\u2019s music video was the first video to reach the 100 million view
        milestone on YouTube and it was the most-watched video at that time. It\u2019s
        second single, <a href=\\\"https://genius.com/Avril-lavigne-when-youre-gone-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/198992\\\">\u201CWhen You\u2019re
        Gone,\u201D</a>, became a top 40 hit in the U.S.</p>\\n\\n<p>After Avril\u2019s
        divorce with first husband Deryck Whibley, her fourth studio album, <em><a
        href=\\\"https://genius.com/albums/Avril-lavigne/Goodbye-lullaby\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/albums/23543\\\">Goodbye Lullaby</a></em> heavily focused
        on heartbreaks and was delayed at one point for her to include more single-ready
        songs and upbeat tracks which she felt it was originally missing. It was an
        even poppier effort than <em>The Best Damn Thing</em>, that mostly focused
        on acoustic instrumentation. The album spawned the top 20 hit <a href=\\\"https://genius.com/Avril-lavigne-what-the-hell-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/5325\\\">\u201CWhat The Hell,\u201D</a>
        and top 70 hits <a href=\\\"https://genius.com/Avril-lavigne-smile-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/49363\\\">\u201CSmile,\u201D</a>
        and <a href=\\\"https://genius.com/Avril-lavigne-wish-you-were-here-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/60507\\\">\u201CWish You Were
        Here.\u201D</a> The album saw Avril taking on production roles for the first
        time.</p>\\n\\n<p>Two years later, Lavigne released her fifth, <a href=\\\"https://genius.com/albums/Avril-lavigne/Avril-lavigne\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/41209\\\">self-titled</a> studio
        album with Epic Records after departing with Arista. It peaked at #5 on the
        Billboard 200, her lowest album peak to date. Musically, critics noticed in
        encompassed styles of music from her previous four albums plus the incorporation
        of industrial rock, electronic music, and folk-pop. It spawned the top 20
        hits <a href=\\\"https://genius.com/Avril-lavigne-smile-lyrics\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/songs/49363\\\">\u201CHere\u2019s To Never Growing Up.\u201D</a>
        <a href=\\\"https://genius.com/Avril-lavigne-rock-n-roll-lyrics\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/songs/194632\\\">\u201CRock N Roll,\u201D</a> <a href=\\\"https://genius.com/Avril-lavigne-let-me-go-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/235758\\\">\u201CLet Me Go,\u201D</a>
        the controversial <a href=\\\"https://genius.com/Avril-lavigne-hello-kitty-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/250174\\\">\u201CHello Kitty\u201D</a>
        and <a href=\\\"https://genius.com/Avril-lavigne-give-you-what-you-like-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/250188\\\">\u201CGive You What
        You Like\u201D</a> were later released as singles, but didn\u2019t fare as
        well. The video for the fourth single got labeled as <a href=\\\"https://www.billboard.com/articles/columns/pop-shop/6062836/avril-lavigne-hello-kitty-video-is-an-embarrassment-in-any\\\"
        rel=\\\"noopener nofollow\\\">\u201Cracist\u201D</a> towards Japanese culture
        in the U.S. despite <a href=\\\"https://www.billboard.com/articles/columns/pop-shop/6077421/avril-lavigne-hello-kitty-video-japan-reaction-tokyo\\\"
        rel=\\\"noopener nofollow\\\">Japan not having a problem with it</a> garnered
        Lavigne some publicity at the time.</p>\\n\\n<p>After a five year hiatus from
        the spotlight, the September of 2018 saw Lavigne releasing \u201C<a href=\\\"https://genius.com/Avril-lavigne-head-above-water-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3929687\\\">Head Above Water</a>,\u201D
        the daring confessional ballad written after accepting her own death due to
        a long-winded battle with Lyme Disease. It served as the lead single to her
        sixth studio album due for release in 2019.</p>\\n\\n<p>Since her professional
        debut, she has become one of the most successful artists in the world, selling
        more than 30 million albums and over 50 million singles worldwide. Of Avril\u2019s
        6 albums, 5 have peaked within the top 5 of the Billboard 200 albums charts,
        and five of the records have featured at least one top 20 hits. All albums
        have attained at least one charting hit. Her notable work and unusual rocker
        image during the 2000s let to the notable comparison indifference to artists
        like <a href=\\\"https://genius.com/artists/Britney-spears\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/artists/1052\\\">Britney Spears</a> who were popular at
        the time. Her time in the 2000s as one of pop and rock\u2019s most notable
        artist led her to the <a href=\\\"https://celebmix.com/rock-princess-avril-lavigne-an-important-figure-in-pop-punk/\\\"
        rel=\\\"noopener nofollow\\\">honorific titles</a> of \u201CPop Punk Princess,\u201D
        \u201CPrincess of Pop\u201D and \u201CPop Rock Princess.\u201D</p>\"},\"comment_count\":0,\"community\":true,\"created_at\":1346002258,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
