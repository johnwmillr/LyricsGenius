        \u201CI Took a Pill in Ibiza,\u201D Posner reflects on his career as a musician,
        specifically the rise-and-fall cycle of his fame. Musically, he demonstrates
        a new, Americana acoustic style, a pivot from his sound on previous songs,
        like \u201CCooler Than Me.\u201D\\n\\nPosner\u2019s guitar driven original
        and SeeBs remixed version of the song both appear on his sophomore album,
        At Night, Alone.\\n\\nThe SeeBs remix, which morphs the song into something
        you might actually hear at an Ibiza club, blew up even harder than the original.\\n\\nIt\u2019s
        ironic that a song about the sad emptiness of music industry fame became so
        much more successful when dressed up in the clothes of a big-house EDM festival
        smasher. It\u2019s a similar story to Lana Del Rey\u2019s \u201CSummertime
        Sadness\u201D and its remix.\\n\\nLike Outkast\u2019s \u201CHey Ya\u201D or
        Springsteen\u2019s \u201CBorn in the USA,\u201D it\u2019s one of those songs
        whose sound and lyrics are completely in contrast to each other, and if you
        only listen to the sound you miss that the lyrics go in an entirely different
        direction.\\n\\nPosner discussed this on Medium.\"},\"comment_count\":1,\"community\":true,\"created_at\":1429116633,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
