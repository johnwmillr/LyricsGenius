        warmer substances, air for example, rise above cooler. When the air is \u201Cthin\u201D
        (less dense than normal) it will rise even faster than normal. His doors,
        scissors, open up much fastes than normal, similar to how smoke rises on a
        hot day.\\n\\nWayne prays that his haters (here, cops) see the consequences
        of his success: luxury. While he passes, people whisper about how much of
        a boss the new money rapper is and how much he threatens the status quo.\\n\\nIn
        a larger sense, Wayne is celebrating the dynamic that defines his life: an
        extremely successful black kid from the ghetto flaunting it to the white world
        (whose penchant for buying iTunes giftcards, ironically, helped make him rich
        in the first place)\\n\\nIt\u2019s also possible that he\u2019s saying that
        the coke disappears like smoke in thin air (because he snorted it).\\n\\n\\n
        \ Smoke disappears in air quickly because smoke (and gases in general) naturally
        want to spread evenly throughout any given space. The empty space essentially
        pulls gas molecules the fill the empty space\\n   In thin air there are less
        gas molecules, therefore there is more empty space in between the air molecules.
        Since there is more empty space, the smoke molecules are pulled to the empty
        space than in normal air.\"},\"comment_count\":0,\"community\":true,\"created_at\":1254155859,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
