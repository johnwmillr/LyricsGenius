        All Eyez On Me, 2Pac embraced a grittier thug persona than he ever did before,
        embedded partially due to his association with gangsta rap label, Death Row
        Records. \u2018Pac felt reincarnated, and this opening aggressive track introduces
        listeners to his new self.\\n\\nDaz Dillinger \u201Cput the gangsta twist\u201D
        over the drums from Joeski Love\u2019s \u201CPee Wee\u2019s Dance\u201D to
        create this beat, and 2Pac wasted no time getting on it since this was the
        first song he created for the album within hours of his release from prison.\\n\\nClose
