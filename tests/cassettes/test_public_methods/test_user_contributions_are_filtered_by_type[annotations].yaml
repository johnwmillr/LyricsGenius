        \u201CMy Name Is\u201D Em raps\\n\\nWell, since age 12, I\u2019ve felt like
        I\u2019m someone else\\nCause I hung my original self from the top bunk with
        a belt\\n\\nSo there\u2019s no use in trying to intimidate him with violence,
        because he enjoys hurting himself so much.\\n\\nThis line is also suggesting
        that you can\u2019t harm him lyrically as he is aware of his faults and often
        plays on this fact. It is particularly prevalent in the film 8 mile where
        he beats many rappers by using his faults to leave them nothing to rap about.
        He also jokes about his pink alf shirt in \u201CWe Made You\u201D  saying:\\n\\n\u201CLord,
        help us, he\u2019s back in his pink ALF shirt\\nLooking like someone shrinked
        his outfit!\u201D\\n\\nonce again harming himself is a joking way.\\n\\nThis
        line could also be in reference to his rapping skill, in that he can go so
        long seemingly without breathing that he\u2019s \u201Cstrangling himself\u201D\"},\"comment_count\":1,\"community\":true,\"created_at\":1294085593,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
