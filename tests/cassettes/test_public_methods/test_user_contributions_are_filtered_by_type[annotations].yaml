        Bling by\_Drake\",\"title\":\"Hotline Bling\",\"type\":\"Song\",\"url\":\"https://genius.com/Drake-hotline-bling-lyrics\"}},\"rejection_comment\":null,\"top_comment\":null,\"verified_by\":null}]},{\"contribution_type\":\"annotation\",\"date\":1348859185,\"contributions\":[{\"_type\":\"annotation\",\"api_path\":\"/annotations/6946520\",\"being_created\":false,\"body\":{\"plain\":\"Courtney
        Everald \u201CJamal\u201D Dewar Jr. (July 7, 1993 \u2013 December 23, 2012),
        performing under the name Capital STEEZ, was a rapper born and raised in Brooklyn,
        New York. Mostly known for co-founding and being a prominent member of the
        Brooklyn rap collective Pro Era, STEEZ\u2019s lyrics were focused on topics
        such as the social injustices of the \u201CAmeriKKKan\u201D system as well
        as metaphysics and spirituality. He was known to have an infatuation with
        the number 47, which Pro Era used as an early logo of theirs.\\n\\nIn 2009-10,
        before the existence of Pro Era, STEEZ had created a duo called The 3rd Kind
        along with his childhood friend Jakk the Rhymer. They released one mixtape
        together, The Yellow Tape, in 2010 before deciding to part ways.\\n\\nIn 2011,
        STEEZ and his classmate Powers Pleasant formed the Pro Era collective out
        of students from Edward R. Murrow High School in Brooklyn, with STEEZ rapidly
        emerging as one of its most prominent members. Pro Era released their debut
        project, The Secc$ TaP.E., in February 2012. STEEZ followed up with his debut
        solo mixtape, Amerikkkan Korruption, on April 7, 2014. In October, STEEZ released
        Amerikkkan Korruption: Reloaded, an expanded version of the mixtape with seven
        extra tracks.\\n\\nPro Era released their second group project, PEEP the aPROcalypse,
        on December 21, 2012. Three days after the release of PEEP, on December 23,
        2012 at 11:59 p.m. STEEZ tweeted \u201CThe end.\u201D He was found dead the
        following day outside the Cinematic Music Group building at age 19. It is
        more than likely STEEZ committed suicide by jumping off the rooftop of the
        building. However, there is still much mystery and speculation surrounding
        his death, as there was no official police report.\\n\\nA posthumous album,
        King Capital, was slated to be released in 2017. However, as of 2025, the
        album has not been released due to issues between Pro Era and STEEZ\u2019s
        family.\\n\\nThe number 47 is a symbol that is omnipresent throughout STEEZ\u2019s
        work and that of Pro Era; as per a Fader Magazine article, he felt it was
        a perfect expression of balance in the world, representing the tension between
        the fourth chakra, the heart, and the seventh chakra, the mind.\"},\"comment_count\":2,\"community\":true,\"created_at\":1348859185,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
