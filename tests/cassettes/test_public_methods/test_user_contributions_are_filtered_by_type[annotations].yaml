        T utilizes some cunning wordplay in this line that may call back to the previous
        lyric where he presents this woman with an ultimatum.\\n\\nIn the 1999 film
        \u201CThe Matrix\u201D, Neo, the film\u2019s main protagonist, is met with
        an ultimatum rather similar to the one Pusha proposes: continue living in
        blissful ignorance inside a simulated reality named the \u201CMatrix\u201D
        or leave the simulation for good and live a harsh reality on the outside (the
        iconic blue/red pill scene).\\nSimply put: leave, or stay.\\n\\nThe person
        Pusha is speaking to in this verse is living in her own \u201CMatrix\u201D
        that Push has built around her by introducing her to a high lifestyle.\"},\"commentable_id\":383498,\"commentable_type\":\"Annotation\",\"created_at\":1556138948,\"has_voters\":true,\"id\":6862663,\"pinned_role\":null,\"votes_total\":46,\"current_user_metadata\":{\"permissions\":[],\"excluded_permissions\":[\"vote\",\"accept\",\"reject\",\"mark_spam\",\"integrate\",\"archive\",\"destroy\"],\"interactions\":{\"vote\":null}},\"anonymous_author\":null,\"author\":{\"_type\":\"user\",\"about_me_summary\":\"i
