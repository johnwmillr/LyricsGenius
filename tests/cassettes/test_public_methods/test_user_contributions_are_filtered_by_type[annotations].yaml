        Ramona Lavigne is a French-Canadian singer-songwriter, fashion designer and
        actress. She was born in Belleville, Ontario, but spent most of her youth
        in Greater Napanee, Ontario. By the age of 15, she had appeared on stage with
        Shania Twain; by 16, she had signed a two-album recording contract with Arista
        Records worth more than $2 million.\\n\\nIn 2002, when she was 17 years old,
        Lavigne broke onto the music scene with her debut album Let Go It featured
        top 10 hits\u201CComplicated,\u201D \u201CSk8er Boi,\u201D and \u201CI\u2019m
        With You.\u201D\\n\\n2004 saw the release of her sophomore effort, the darker,
        grungier Under My Skin which was her first #1 in the states and featured top
        10 hit \u201CMy Happy Ending,\u201D and top 40 lead single \u201CDon\u2019t
        Tell Me.\u201D\\n\\nThree years later she returned with her second number
        1 The Best Damn Thing, a bright, pop-punk album which strayed away from her
        previous efforts switching meaningful and personal lyricism music she more
        bratty, fun music she could enjoy performing live. It spawned Avril\u2019s
        first and only #1 hit on the Billboard Hot 100 chart: \u201CGirlfriend.\u201D
        The song\u2019s music video was the first video to reach the 100 million view
        milestone on YouTube and it was the most-watched video at that time. It\u2019s
        second single, \u201CWhen You\u2019re Gone,\u201D, became a top 40 hit in
        the U.S.\\n\\nAfter Avril\u2019s divorce with first husband Deryck Whibley,
        her fourth studio album, Goodbye Lullaby heavily focused on heartbreaks and
        was delayed at one point for her to include more single-ready songs and upbeat
        tracks which she felt it was originally missing. It was an even poppier effort
        than The Best Damn Thing, that mostly focused on acoustic instrumentation.
        The album spawned the top 20 hit \u201CWhat The Hell,\u201D and top 70 hits
        \u201CSmile,\u201D and \u201CWish You Were Here.\u201D The album saw Avril
        taking on production roles for the first time.\\n\\nTwo years later, Lavigne
        released her fifth, self-titled studio album with Epic Records after departing
        with Arista. It peaked at #5 on the Billboard 200, her lowest album peak to
        date. Musically, critics noticed in encompassed styles of music from her previous
        four albums plus the incorporation of industrial rock, electronic music, and
        folk-pop. It spawned the top 20 hits \u201CHere\u2019s To Never Growing Up.\u201D
        \u201CRock N Roll,\u201D \u201CLet Me Go,\u201D the controversial \u201CHello
        Kitty\u201D and \u201CGive You What You Like\u201D were later released as
        singles, but didn\u2019t fare as well. The video for the fourth single got
        labeled as \u201Cracist\u201D towards Japanese culture in the U.S. despite
        Japan not having a problem with it garnered Lavigne some publicity at the
        time.\\n\\nAfter a five year hiatus from the spotlight, the September of 2018
        saw Lavigne releasing \u201CHead Above Water,\u201D the daring confessional
        ballad written after accepting her own death due to a long-winded battle with
        Lyme Disease. It served as the lead single to her sixth studio album due for
        release in 2019.\\n\\nSince her professional debut, she has become one of
        the most successful artists in the world, selling more than 30 million albums
        and over 50 million singles worldwide. Of Avril\u2019s 6 albums, 5 have peaked
        within the top 5 of the Billboard 200 albums charts, and five of the records
        have featured at least one top 20 hits. All albums have attained at least
        one charting hit. Her notable work and unusual rocker image during the 2000s
        let to the notable comparison indifference to artists like Britney Spears
        who were popular at the time. Her time in the 2000s as one of pop and rock\u2019s
        most notable artist led her to the honorific titles of \u201CPop Punk Princess,\u201D
        \u201CPrincess of Pop\u201D and \u201CPop Rock Princess.\u201D\"},\"comment_count\":0,\"community\":true,\"created_at\":1346002258,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
