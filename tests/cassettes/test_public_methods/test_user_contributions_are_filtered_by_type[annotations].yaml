      string: "{\"meta\":{\"status\":200},\"response\":{\"contribution_groups\":[{\"contribution_type\":\"annotation\",\"date\":1317877527,\"contributions\":[{\"_type\":\"annotation\",\"api_path\":\"/annotations/6925647\",\"being_created\":false,\"body\":{\"html\":\"<p>Dwayne
        Michael Carter Jr. (born September 27, 1982), better known by his stage name
        <a href=\\\"https://genius.com/Rap-genius-the-many-nicknames-of-lil-wayne-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/212529\\\">Lil Wayne</a>, grew
        up in the Hollygrove neighborhood of New Orleans, Louisiana.</p>\\n\\n<p>At
        the age of nine, Lil Wayne joined Cash Money Records as the youngest member
        of the label, and half of the duo, The B.G.\u2018z, with <a href=\\\"https://genius.com/artists/Bg\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/artists/1819\\\">B.G.</a>. In 1997,
        Lil Wayne joined the group <a href=\\\"https://genius.com/artists/Hot-boys\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/artists/1663\\\">Hot Boys</a>, which
        also included rappers <a href=\\\"https://genius.com/artists/Juvenile\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/artists/38\\\">Juvenile</a>, <a href=\\\"https://genius.com/artists/Bg\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/artists/1819\\\">B.G.</a>, and <a
        href=\\\"https://genius.com/artists/Young-turk\\\" rel=\\\"noopener\\\" data-api_path=\\\"/artists/3558\\\">Young
        Turk</a>. Lil Wayne gained most of his success with the group\u2019s major
        selling album <a href=\\\"https://genius.com/albums/Hot-boys/Guerrilla-warfare\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/3680\\\">Guerrilla Warfare</a>,
        released in 1999. <a href=\\\"http://www.guinnessworldrecords.com/world-records/rapper-with-the-most-us-hot-100-hits\\\"
        rel=\\\"noopener nofollow\\\">He has been listed in the 2012 Guinness Book
        Of World Records</a> for the record of Most US Hot 100 Hits By A Rap Artist
        with 64 hits between 1999 and 2010.</p>\\n\\n<p>Wayne is famous for his command
        of slow, witty lines and metaphorical jokes. <a href=\\\"https://en.wikipedia.org/wiki/Lil_Wayne_albums_discography\\\"
        rel=\\\"noopener nofollow\\\">His discography</a> includes a slew of successful
        mixtapes, including <a href=\\\"https://genius.com/albums/Lil-wayne/The-dedication\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/21532\\\"><em>Dedication</em>
        1</a>, <a href=\\\"https://genius.com/albums/Lil-wayne/Dedication-2\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/albums/5004\\\">2</a>, <a href=\\\"https://genius.com/albums/Lil-wayne/Dedication-3\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/12981\\\">3</a>, <a href=\\\"https://genius.com/albums/Lil-wayne/Dedication-4\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/20748\\\">4</a>, <a href=\\\"https://genius.com/albums/Lil-wayne/Dedication-5\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/41879\\\">5</a> and <a href=\\\"https://genius.com/albums/Lil-wayne/Dedication-6\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/388686\\\">6</a>; <em><a href=\\\"https://genius.com/albums/Lil-wayne/No-ceilings\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/11095\\\">No Ceilings</a>;</em>
        and <em><a href=\\\"https://genius.com/albums/Lil-wayne/Da-drought-3\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/albums/5010\\\">Da Drought 3</a></em>. His albums consistently
        garner acclaim, with <em><a href=\\\"https://genius.com/albums/Lil-wayne/Tha-carter\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/4998\\\">Tha Carter</a></em>
        series all platinum hits. <em>Tha Carter</em> series has been a work of Wayne\u2019s
        for 13 years and continues to grow with the fifth installment, <a href=\\\"https://genius.com/albums/Lil-wayne/Tha-carter-v\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/albums/98888\\\"><em>Tha Carter V</em></a>
        released in 2018 (however, it was initially supposed to be released in late
        2014). Wayne keeps a regular recording schedule, with studio booths in his
        tour bus, home, and following him everywhere.</p>\"},\"comment_count\":3,\"community\":true,\"created_at\":1317877527,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
