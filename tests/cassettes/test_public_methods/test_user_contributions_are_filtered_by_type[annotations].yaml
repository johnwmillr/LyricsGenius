        (and Africans generally) are thought to have particularly tough hair.\\n\\n\\n\\nLil
        Wayne is tough because of all that he had gone through in his (then) short
        life. His father abandoned his family when he was two years old and was raised
        in poverty by a single mother. He had his first child when he was only fifteen
        years old. Even though the odds were stacked against Weezy, he became successful.\\n\\nAccording
        to the Native article \u201C\u2019T-Wayne\u2019 takes us back to that time
        Lil Wayne was the best rapper alive\u201D, published in 2017, a magazine dedicated
        to African content, Nigerians actually received this line in a very positive
        way:\\n\\nMost importantly to Nigerians however was the freestyle on track
        3, \u201CA Milli\u201D. When Weezy said \u201CA millionaire, I\u2019m a Young
        Money millionaire, tougher than Nigerian hair\u201D it was a wrap. From that
        point on, Lil Wayne was crowned the king of rap in Nigeria.\\n\\nLil Wayne
        would go on to confirm that he\u2019s 53% Nigerian in an interview with NORE
        on February 1, 2020.\"},\"comment_count\":2,\"community\":true,\"created_at\":1252895569,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
