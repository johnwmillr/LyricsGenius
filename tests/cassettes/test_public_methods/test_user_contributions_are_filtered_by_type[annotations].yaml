        sex is referred to as \u201Csafe,\u201D it often refers to when the male wears
        a condom\u2014a contraceptive which is often made out of latex\u2014to prevent
        the transfer of STDs (sexually transmitted diseases) and to prevent pregnancy.\\n\\nWayne
        continues to promote the use of contraceptives as he notes that if one is
        not used during sex, then the male will most likely get a text reading \u201CI
        think I\u2019m late.\u201D This refers to the female\u2019s period being missed
        as it\u2019s a sign of a halt in ovulation due to an egg being fertilized.\\n\\nWhile
        promoting safety in sex, Wayne takes advantage of this as he again shows off
        his critically acclaimed wordplay as he rhymes \u201Cgreat sex,\u201D \u201Clatex,\u201D
        and \u201Clate text\u201D together.\\n\\nIn April 2021, almost 13 years following
        the release of the song, Wayne redacted to this particular lyric with Fox
        Sports\u2018 reporter, Darnell Smith in an unreleased interview in which he
        revealed he completely freestyled the track:\\n\\nI\u2019mma dog! I didn\u2019t
