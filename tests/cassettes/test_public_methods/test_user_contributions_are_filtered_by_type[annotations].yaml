        \u201CCam'ron\u201D Giles is perhaps the quintessential Genius artist. Killa
        Cam started out alongside Big L, Ma$e, his cousin Bloodshed (R.I.P.) and others
        in the short-lived group Children of the Corn.  He had several successful
        solo albums, but it\u2019s his 2004 record Purple Haze that stands as the
        quintessence of all things Cam'ronian.\\n\\nSince then, Cam has kept his computers
        \u2018puting on a series of albums and mixtapes by himself, with Dipset, and
        with his standout new protege Vado.  We here at RG salute Mr. Giles, without
        whom this site might not exist.  May your diamonds keep on doing the Macarena.\"},\"comment_count\":0,\"community\":true,\"created_at\":1306274984,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
