        Forms of Fear is the sixth studio album by Australian singer-songwriter Sia
        Furler. It was released on 4 July 2014. Lyrically, the record showcases Furler
        dealing with drug addition and bipolar disorder.\\n\\nIn an interview published
        by NME in February 2015, Furler revealed that the album as a contractual obligation:
        \u201CBasically, I put this out to get out of my publishing deal. I was planning
        to be a pop song writer for other artists. But my publishing deal was as an
        artist so I had to put one more album out. I didn\u2019t want to get famous
        so I kept all the songs I wanted and had fun making it.\u201D\\n\\nIn an interview
        with Dazed & Confused, Furler explained that she had decided to not show her
        face during the promotion of 1000 Forms of Fear. Instead she focused on creating
        visual art through her videos. Furler recruited American child dancer Maddie
        Ziegler to be her persona on stage and performer with her back facing to the
