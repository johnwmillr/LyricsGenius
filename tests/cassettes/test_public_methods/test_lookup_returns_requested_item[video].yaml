      string: "{\"meta\":{\"status\":200},\"response\":{\"video\":{\"_type\":\"video\",\"api_path\":\"/videos/18681\",\"article_url\":\"https://genius.com/a/machine-gun-kelly-reacts-to-lizzo-polo-g-comethazine-on-the-cosign\",\"author_list_for_display\":\"Rahel
        Gebreyes\",\"body\":{\"plain\":\"Cleveland rapper Machine Gun Kelly sat down
        with Genius for the latest episode of The Cosign to review some of the fresh
        talent coming out of the Midwest.\\n\\nFrom Lizzo\u2019s body-positive dance
        anthem, \u201CTempo,\u201D to Polo G\u2019s emotional recollection of his
        come-up, \u201CThrough da Storm,\u201D to Comethazine\u2019s high-energy track,
        \u201CNONSENSE,\u201D MGK shared his thoughts on the Midwest rappers making
        noise today.\\n\\nMGK said one of the qualities that sets Midwest rap music
        apart from other areas is its combination of lyrical content and the reality
        of the streets. After watching the music videos, he was glad to see that the
        new rappers were still carrying that legacy forward.\\n\\n\u201CAs far as
        the new generation of Midwest artists, I love this. I love that the storytelling
        is still there. That\u2019s all I really care about,\u201D he said. \u201CThe
        production and beats are going to change over time, just because sound changes,
        but the storytelling and the darkness is still there.\u201D\\n\\nWatch the
        video above to see which new Midwest rapper received Machine Gun Kelly\u2019s
        cosign and subscribe to the Genius YouTube page.\"},\"comment_count\":3,\"dek\":\"\\\"As
