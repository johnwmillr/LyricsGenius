        IS THE GETTIER!! It is a true statement, it is justified, and yet it just
        doesn\u2019t seem like knowledge!</p>\\n\\n<p>The issue here is that although
        Smith holds a justified belief in the sense that all propositions used to
        conclude (e) are true, the premise propositions  within (d) do not properly
        refer to the correct objects out in the real world when concluding (e). Namely,
        although Smith believes (e) (and correctly so), the crux of the issue is that
        he does not properly understand that the referent (the object that is picked
        out in the world by a linguistic phrase) of proposition (e) is in fact himself,
        not Jones.</p>\"},\"comment_count\":0,\"community\":true,\"created_at\":1400347815,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
