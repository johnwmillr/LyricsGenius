      string: "{\"meta\":{\"status\":200},\"response\":{\"contribution_groups\":[{\"contribution_type\":\"annotation\",\"date\":1349194678,\"contributions\":[{\"_type\":\"annotation\",\"api_path\":\"/annotations/1105132\",\"being_created\":false,\"body\":{\"html\":\"<p><strong><em><a
        href=\\\"http://en.wikipedia.org/wiki/Mesopotamia\\\" rel=\\\"noopener nofollow\\\">Ancient
        Mesopotamian</a></em></strong> isn\u2019t a language. Rather, it\u2019s an
        amalgamation of various cultural groups across a specific geographical region
        who spoke (and wrote in) a variety of languages \u2013 <em>Sumerian, Semitic
        dialects, Akkadian</em>, etc. In fact Sumerian itself may be just an off-shoot
        of ancient Dravidian languages from what is today southern India. So it\u2019s
        a little bit like saying  <strong><em>\u201Cas comprehensible as African.\u201D</em></strong></p>\\n\\n<p><img
        src=\\\"https://images.rapgenius.com/e70ed2a9adf830328c04fab364046634.650x857x1.jpg\\\"
        alt=\\\"\\\" width=\\\"650\\\" height=\\\"857\\\" data-animated=\\\"false\\\"></p>\\n\\n<p>FACT:
        Ancient Mesopotamian languages were every bit as comprehensible as rap to
        most <em>Ancient Mesopotamians</em> until the 2200s B.C.E., when <strong><em><a
        href=\\\"http://en.wikipedia.org/wiki/Sargon_of_Akkad\\\" rel=\\\"noopener
        nofollow\\\">Sargon the Great</a></em></strong> made everyone convert to a
        uniform, syllabic Akkadian script</p>\\n\\n<p><img src=\\\"https://images.rapgenius.com/1fc008c57c4c81badace78bc9598e0fc.550x548x1.jpg\\\"
        alt=\\\"\\\" width=\\\"550\\\" height=\\\"548\\\" data-animated=\\\"false\\\"></p>\\n\\n<p>When
        Sargon was an infant, his single mother couldn\u2019t raise him. So she put
        him in a reed basket and floated the little man down the river, where he was
        discovered and subsequently raised by a woman who found him while drawing
        water. <a href=\\\"http://ancienthistory.about.com/od/exodus/qt/051209MosesBasket.htm\\\"
        rel=\\\"noopener nofollow\\\">Sound familiar?</a></p>\\n\\n<p><img src=\\\"https://images.rapgenius.com/4645b0b93589d23d7fb35458288a812c.669x1000x1.jpg\\\"
        alt=\\\"\\\" width=\\\"669\\\" height=\\\"1000\\\" data-animated=\\\"false\\\"></p>\\n\\n<p>It\u2019s
        not just Sargon and Moses though \u2013 there are many similar <strong><em>baby
        left in a basket</em></strong> ancient birth stories, famously analyzed and
        compared by <strong><em><a href=\\\"http://en.wikipedia.org/wiki/Otto_Rank\\\"
        rel=\\\"noopener nofollow\\\">Otto Rank</a></em></strong> in his book <strong><em><a
        href=\\\"http://www.sacred-texts.com/neu/mbh/mbh01.htm\\\" rel=\\\"noopener
        nofollow\\\">The Myth of the Birth of the Hero</a></em></strong></p>\"},\"comment_count\":0,\"community\":true,\"created_at\":1349194678,\"custom_preview\":null,\"deleted\":false,\"embed_content\":\"<blockquote
