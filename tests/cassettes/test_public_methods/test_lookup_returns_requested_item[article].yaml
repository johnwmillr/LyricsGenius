      string: "{\"meta\":{\"status\":200},\"response\":{\"article\":{\"_type\":\"article\",\"api_path\":\"/articles/11880\",\"article_type\":\"feature\",\"author_list_for_display\":\"Chris
        Mench\",\"body\":{\"html\":\"<p><a href=\\\"https://genius.com/artists/Cardi-b\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/artists/621678\\\">Cardi B</a> and
        <a href=\\\"https://genius.com/artists/Megan-thee-stallion\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/artists/1125517\\\">Megan Thee Stallion</a> earned an enduring
        hit with <a href=\\\"https://genius.com/Cardi-b-wap-lyrics\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/songs/5832126\\\">\u201CWAP,\u201D</a> their explicit single
        that just returned to No. 1 on the Billboard Hot 100 chart this week. The
        song has found success across platforms, including on Genius, where it notched
        the biggest pageview total for a single month in the site\u2019s history.</p>\\n\\n<p>\u201CWAP\u201D
        earned 12.47 million pageviews in August, nearly double the previous record
        set by <a href=\\\"https://genius.com/artists/Ariana-grande\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/artists/26507\\\">Ariana Grande</a>\u2019s <a href=\\\"https://genius.com/Ariana-grande-thank-u-next-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/4063065\\\">\u201Cthank u, next\u201D</a>
        in November 2018. Grande\u2019s track amassed 6.45 million pageviews at the
        time, a high watermark for nearly two years of Genius' history.</p>\\n\\n<p>Fans
        were drawn to \u201CWAP\u201D for a variety of reasons. The song\u2019s overall
        success attracted attention, as did viral TikTok videos using the song\u2019s
        audio for everything from a dance challenge to comedy skits. There was also
        an outsized backlash from conservative pundits and commentators who objected
        to the track\u2019s raunchy lyrics. Most notably, Ben Shapiro read a portion
        of the lyrics aloud, drawing widespread mockery on social media:</p>\\n\\n<p></p><div
        class=\\\"embedly_preview\\\">\\n<blockquote class=\\\"twitter-tweet\\\">\\n<p
        lang=\\\"en\\\" dir=\\\"ltr\\\">Ben Shapiro reads \\\"WAP\\\" lyrics <a href=\\\"https://t.co/bIVH1Pnwvx\\\">pic.twitter.com/bIVH1Pnwvx</a></p>\u2014
        Jason Campbell (@JasonSCampbell) <a href=\\\"https://twitter.com/JasonSCampbell/status/1292900655464677377?ref_src=twsrc%5Etfw\\\">August
        10, 2020</a>\\n</blockquote>\\n<script async src=\\\"https://platform.twitter.com/widgets.js\\\"
        charset=\\\"utf-8\\\"></script>\\n</div>\\n\\n<p>The single best day for \u201CWAP,\u201D
        however, came just after it reached No. 1 on the Hot 100 chart for the first
        time. The song page garnered more than 800,000 pageviews on August 18 as the
        song\u2019s dominated the <em>Billboard</em> chart.</p>\\n\\n<p>\u201CWAP\u201D
        now has 13.6 million pageviews on Genius, good enough to sit at No. 4 on the
        all-time Top Songs chart. It\u2019s just above <a href=\\\"https://genius.com/artists/Kendrick-lamar\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/artists/1421\\\">Kendrick Lamar</a>\u2019s
        <a href=\\\"https://genius.com/Kendrick-lamar-humble-lyrics\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/songs/3039923\\\">\u201CHUMBLE.,\u201D</a> while still
        below <a href=\\\"https://genius.com/artists/Luis-fonsi\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/artists/344497\\\">Luis Fonsi</a> and <a href=\\\"https://genius.com/artists/Daddy-yankee\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/artists/1823\\\">Daddy Yankee</a>\u2019s
        <a href=\\\"https://genius.com/Luis-fonsi-and-daddy-yankee-despacito-remix-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3057010\\\">\u201CDespacito
        (Remix),\u201D</a> <a href=\\\"https://genius.com/artists/Eminem\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/artists/45\\\">Eminem</a>\u2019s <a href=\\\"https://genius.com/Eminem-rap-god-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/235729\\\">\u201CRap God,\u201D</a>
        and <a href=\\\"https://genius.com/artists/Ed-sheeran\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/artists/12418\\\">Ed Sheeran</a>\u2019s <a href=\\\"https://genius.com/Ed-sheeran-shape-of-you-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/2949128\\\">\u201CShape of You.\u201D</a>
        Megan and Cardi\u2019s song has averaged more than 80,000 pageviews per day
        in September, putting it on track to eclipse \u201CShape of You\u201D in the
        coming weeks.</p>\\n\\n<p>Although no other song\u2019s one-month performance
        measures up to \u201CWAP,\u201D there are several tracks in the past few years
        that have posted huge pageview totals. Ariana Grande has two of the Top 10
        weeks with \u201Cthank u, next\u201D and <a href=\\\"https://genius.com/Ariana-grande-7-rings-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/4067762\\\">\u201C7 rings,\u201D</a>
        while Drake controls a pair of spots with <a href=\\\"https://genius.com/Drake-gods-plan-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3315890\\\">\u201CGod\u2019s
        Plan\u201D</a> and <a href=\\\"https://genius.com/Drake-in-my-feelings-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3807759\\\">\u201CIn My Feelings.\u201D</a>
        Luis Fonsi and Daddy Yankee are the chart\u2019s only three-peaters. Their
        \u201CDespacito (Remix),\u201D the most popular song in Genius history, posted
        three of the biggest single-month pageview totals of all time in 2017.</p>\\n\\n<p>The
        10 biggest single-month performances of all time on Genius are as follows:</p>\\n\\n<ol>\\n<li>Cardi
        B feat. Megan Thee Stallion, <a href=\\\"https://genius.com/Cardi-b-wap-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/5832126\\\">\u201CWAP\u201D</a>
        (12.47 million pageviews, Aug. 2020)</li>\\n<li>Ariana Grande, <a href=\\\"https://genius.com/Ariana-grande-thank-u-next-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/4063065\\\">\u201Cthank u, next\u201D</a>
        (6.45 million pageviews, Nov. 2018)</li>\\n<li>Luis Fonsi &amp; Daddy Yankee
        feat. Justin Bieber, <a href=\\\"https://genius.com/Luis-fonsi-and-daddy-yankee-despacito-remix-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3057010\\\">\u201CDespacito
        (Remix)\u201D</a> (5.2 million pageviews, July 2017)</li>\\n<li>Luis Fonsi
        &amp; Daddy Yankee feat. Justin Bieber, <a href=\\\"https://genius.com/Luis-fonsi-and-daddy-yankee-despacito-remix-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3057010\\\">\u201CDespacito
        (Remix)\u201D</a> (4.87 million pageviews, May 2017)</li>\\n<li>Drake, <a
        href=\\\"https://genius.com/Drake-in-my-feelings-lyrics\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/songs/3807759\\\">\u201CIn My Feelings\u201D</a> (4.67
        million pageviews, July 2018)</li>\\n<li>Eminem, <a href=\\\"https://genius.com/Eminem-killshot-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3958196\\\">\u201CKillshot\u201D</a>
        (4.39 million pageviews, Sept. 2018)</li>\\n<li>Luis Fonsi &amp; Daddy Yankee
        feat. Justin Bieber, <a href=\\\"https://genius.com/Luis-fonsi-and-daddy-yankee-despacito-remix-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3057010\\\">\u201CDespacito
        (Remix)\u201D</a> (3.86 million pageviews, June 2017)</li>\\n<li>Ariana Grande,
        <a href=\\\"https://genius.com/Ariana-grande-7-rings-lyrics\\\" rel=\\\"noopener\\\"
        data-api_path=\\\"/songs/4067762\\\">\u201C7 rings\u201D</a> (3.81 million
        pageviews, Jan. 2019)</li>\\n<li>Kendrick Lamar, <a href=\\\"https://genius.com/Kendrick-lamar-humble-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3039923\\\">\u201CHUMBLE.\u201D</a>
        (3.3 million pageviews, April 2017)</li>\\n<li>Drake, <a href=\\\"https://genius.com/Drake-gods-plan-lyrics\\\"
        rel=\\\"noopener\\\" data-api_path=\\\"/songs/3315890\\\">\u201CGod\u2019s
        Plan\u201D</a> (2.56 million pageviews, Jan. 2018)</li>\\n</ol>\\n\\n\\n<p>\u201CWAP\u201D
        is less than one million total pageviews away from Sheeran\u2019s \u201CShape
        of You,\u201D and less than three million from Eminem\u2019s \u201CRap God.\u201D
        In order to become the most popular song of all time on Genius, however, it
        would need to almost double its current total. \u201CDespacito (Remix)\u201D
        has racked up 23.1 million pageviews since its 2017 release. Fans will have
        to wait and see if \u201CWAP\u201D has what it takes to earn the top spot.</p>\\n\\n<p><a
        href=\\\"https://genius.com/Cardi-b-wap-lyrics\\\" rel=\\\"noopener\\\" data-api_path=\\\"/songs/5832126\\\">Read
        all the lyrics to Cardi B\u2019s \u201CWAP\u201D featuring Megan Thee Stallion</a>
        on Genius now.</p>\"},\"comment_count\":7,\"dek\":\"The song earned more than
