fail_fast: true

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.6.14 # uv version.
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.4 # Ruff version.
    hooks:
      - id: ruff
        name: Lint with ruff
        types_or: [python, pyi]
        args: [--fix]
      - id: ruff-format
        name: Format with ruff
        types_or: [python, pyi]
  - repo: local
    hooks:
      - id: mypy
        name: Type check with mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pytest
        name: Run pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        always_run: true
