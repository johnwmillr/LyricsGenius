[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lyricsgenius"
dynamic = ["version"]
dependencies = ["beautifulsoup4>=4.12.3", "requests>=2.27.1"]
requires-python = ">=3.11"
authors = [{ name = "John W. R. Miller", email = "john.w.millr+lg@gmail.com" }]
description = "Download lyrics and metadata from Genius.com"
readme = "README.md"
license = "MIT"
keywords = [
    "lyrics",
    "lyricsgenius",
    "genius",
    "genius-api",
    "genius-lyrics",
    "download-lyrics",
    "download-song-lyrics",
    "scraping-lyrics",
    "song-lyrics",
]

[project.optional-dependencies]
docs = ["sphinx>=4.3.2", "sphinx-rtd-theme>=1.3.0"]

[project.urls]
Homepage = "https://www.johnwmillr.com/scraping-genius-lyrics/"
Documentation = "https://lyricsgenius.readthedocs.io/en/master/"
Repository = "https://github.com/johnwmillr/LyricsGenius"
Issues = "https://github.com/johnwmillr/LyricsGenius/issues"

[dependency-groups]
dev = [
    "mypy>=1.15.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.1",
    "pytest-recording>=0.14.1",
    "ruff>=0.11.4",
    "sphinx>=4.3.2",
    "sphinx-rtd-theme>=1.3.0",
    "types-html5lib>=1.1.11.20241018",
    "types-requests>=2.32.0.20250328",
]

# The version is read from the release tag, so nothing in the tree needs bumping.
[tool.hatch.version]
source = "vcs"

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/p/lyricsgenius/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.pyright]
typeCheckingMode = "off"
ignore = ["*"]

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = ["E4", "E7", "E9", "F", "B", "Q", "I"]

# Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

# Ignore `E402` (import violations) in all `__init__.py` files, and in selected subdirectories.
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402", "F401"]
"**/{tests,docs,tools}/*" = ["E402", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
check_untyped_defs = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
files = ["lyricsgenius"]
ignore_missing_imports = false
strict = false
warn_no_return = true
warn_redundant_casts = true
warn_return_any = false
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = ["live: makes real requests to Genius; skipped unless --live is given"]
