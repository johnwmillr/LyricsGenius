name: publish-to-testpypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 3.15.0rc1. Defaults to a dev version derived from the commit.
        required: false
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # hatch-vcs reads the version from the tags and history
          persist-credentials: false

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
        with:
          version: "0.6.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Resolve the version to publish
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$REF_TYPE" != "tag" ]; then
            # Off a tag, hatch-vcs appends a local segment (+g<sha>) that PyPI and
            # TestPyPI both reject. Derive the same version without it, and use the
            # run number as the dev counter so every dispatch gets a fresh version
            # rather than being silently skipped by skip-existing.
            base=$(uvx --with setuptools-scm python -c \
              "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))")
            version="${base%%.dev*}.dev${RUN_NUMBER}"
          fi
          # On a tag with no override, leave this empty and let hatch-vcs derive it.
          echo "Version: ${version:-<derived from the tag>}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the package
        env:
          # setuptools-scm, which hatch-vcs wraps, honours this. Empty means "derive".
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.resolve.outputs.version }}
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: built-package
          path: dist/

  publish-to-testpypi:
    name: Upload release to TestPyPI
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lyricsgenius
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: built-package
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: false
          skip-existing: true
