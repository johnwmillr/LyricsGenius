name: publish-to-testpypi

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, e.g. 3.15.0rc1. Defaults to a dev version derived from the commit.
        required: false
        type: string

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0  # hatch-vcs reads the version from the tags and history
          persist-credentials: false

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          version: "0.6.11"
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.6.0
        with:
          python-version-file: ".python-version"

      - name: Resolve the version to publish
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          if [ -z "$version" ] && [ "$REF_TYPE" != "tag" ]; then
            # Off a tag, hatch-vcs appends a local segment (+g<sha>) that PyPI and
            # TestPyPI both reject. Derive the same version without it, and use the
            # run number as the dev counter so every dispatch gets a fresh version
            # rather than being silently skipped by skip-existing.
            base=$(uvx --with setuptools-scm python -c \
              "from setuptools_scm import get_version; print(get_version(local_scheme='no-local-version'))")
            version="${base%%.dev*}.dev${RUN_NUMBER}"
          fi
          # On a tag with no override, leave this empty and let hatch-vcs derive it.
          echo "Version: ${version:-<derived from the tag>}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the package
        env:
          # setuptools-scm, which hatch-vcs wraps, honours this. Empty means "derive".
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.resolve.outputs.version }}
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: built-package
          path: dist/

  publish-to-testpypi:
    name: Upload release to TestPyPI
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lyricsgenius
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download all the dists
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v.4.2.1
        with:
          name: built-package
          path: dist/

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: false
          skip-existing: true
